# Overlay de production — utiliser avec :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Différences vs dev :
#   - postgres/redis non exposés sur l'hôte (sécurité)
#   - api/web : écoute sur la loopback uniquement, jamais sur l'IP publique
#   - api : pas de hot-reload, pas de volume source
#   - api : 4 workers uvicorn
#   - web : image buildée (pas de volume source)

services:
  postgres:
    ports: !reset []          # Ne pas exposer 5432 sur l'hôte en prod
    restart: unless-stopped

  redis:
    ports: !reset []          # Ne pas exposer 6379 sur l'hôte en prod
    restart: unless-stopped

  api:
    # Sans ce !override, le "8000:8000" du compose de dev est hérité et
    # Docker publie l'API sur 0.0.0.0 — donc joignable en HTTP nu depuis
    # Internet, en contournant le nginx Plesk (plus de TLS, plus de HSTS,
    # plus de logs d'accès). On se limite à la loopback : seul le reverse
    # proxy de l'hôte peut atteindre le conteneur.
    ports: !override
      - "127.0.0.1:8000:8000"
    # Pas de montage source en prod, mais un volume persistant pour les
    # fichiers uploadés (Kbis des garages).
    volumes: !override
      - uploads:/app/uploads
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --proxy-headers
      --forwarded-allow-ips '*'
    restart: unless-stopped

  web:
    # Idem api : le front n'est atteint que via le reverse proxy de l'hôte.
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  uploads:
