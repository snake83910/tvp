# Overlay de production — utiliser avec :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Différences vs dev :
#   - postgres/redis non exposés sur l'hôte (sécurité)
#   - api/web : écoute sur la loopback uniquement, jamais sur l'IP publique
#   - api : pas de hot-reload, pas de volume source
#   - api : 4 workers uvicorn
#   - web : image buildée (pas de volume source)

services:
  postgres:
    ports: !reset []          # Ne pas exposer 5432 sur l'hôte en prod
    restart: unless-stopped

  redis:
    ports: !reset []          # Ne pas exposer 6379 sur l'hôte en prod
    restart: unless-stopped

  api:
    # Image d'exécution seule : pas de pytest, ruff ni pip-audit en
    # production. Chaque paquet en moins est une dépendance de moins à
    # auditer et à patcher.
    build:
      context: ./api
      target: runtime
    # Sans ce !override, le "8000:8000" du compose de dev est hérité et
    # Docker publie l'API sur 0.0.0.0 — donc joignable en HTTP nu depuis
    # Internet, en contournant le nginx Plesk (plus de TLS, plus de HSTS,
    # plus de logs d'accès). On se limite à la loopback : seul le reverse
    # proxy de l'hôte peut atteindre le conteneur.
    ports: !override
      - "127.0.0.1:8000:8000"
    # Pas de montage source en prod, mais un volume persistant pour les
    # fichiers uploadés (Kbis des garages).
    volumes: !override
      - uploads:/app/uploads
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --proxy-headers
      --forwarded-allow-ips '*'
    restart: unless-stopped

  web:
    # Idem api : le front n'est atteint que via le reverse proxy de l'hôte.
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  # Consultation de la base de production, à distance. Ne démarre jamais
  # avec la pile (profil « outils ») : il faut le nommer explicitement.
  #
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
  #     --profile outils up -d pgweb
  #
  # Puis, depuis son poste :  ssh -L 8081:127.0.0.1:8081 user@serveur
  # et ouvrir http://localhost:8081. Le service n'écoute que sur la
  # loopback du serveur : le tunnel SSH est le SEUL chemin, et il est
  # déjà protégé par la clé SSH. D'où l'absence d'authentification HTTP
  # ici — elle n'ajouterait rien contre quelqu'un qui a déjà un shell,
  # et ferait un secret de plus à gérer.
  #
  # `--readonly` : sur la production, une écriture faite ici ne passerait
  # ni par la machine à états des commandes, ni par l'audit, ni par les
  # emails. Un statut passé à « remboursée » à la main marquerait la
  # commande réglée sans qu'un centime ne bouge. On consulte, on ne
  # modifie pas.
  #
  # Pas de `restart` : il meurt au redémarrage du serveur, et c'est très
  # bien. On le rallume pour une session de diagnostic, pas à demeure.
  pgweb:
    command: ["--readonly", "--lock-session"]

volumes:
  uploads:
